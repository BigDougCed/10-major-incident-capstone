name: CI

on:
  push:
  pull_request:

jobs:
  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse all PowerShell files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Include *.ps1, *.psm1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($e in $errors) {
              Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed = $true
            }
            if (-not $errors) { Write-Host "OK  $($_.Name)" }
          }
          if ($failed) { exit 1 }

      - name: PSScriptAnalyzer (errors fail the build, warnings are listed)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error, Warning `
                       -ExcludeRule PSAvoidUsingWriteHost, PSUseShouldProcessForStateChangingFunctions
          $results | Sort-Object Severity, ScriptName | Format-Table Severity, ScriptName, Line, RuleName, Message -AutoSize -Wrap
          if ($results | Where-Object Severity -eq 'Error') { exit 1 }

      - name: Pester tests
        if: hashFiles('tests/**/*.Tests.ps1') != ''
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.5
          Invoke-Pester -Path tests -CI -Output Detailed
